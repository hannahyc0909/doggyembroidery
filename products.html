<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品選品 ｜ 哈拿的刺繡星球</title>

  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- PapaParse for CSV loading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --brand-brown: #5c4033;
      --brand-accent: #e07a5f;
      --bg-main: #faf9f6;
      --bg-card: #ffffff;
      --text-main: #27272a;
      --text-muted: #71717a;
      --text-light: #a1a1aa;
      --border-color: #ebe7df;
      --tag-new: #fef3c7;
      --tag-new-text: #92400e;
      --tag-stock: #dcfce7;
      --tag-stock-text: #166534;
      --tag-hot: #fee2e2;
      --tag-hot-text: #991b1b;
      --tag-custom: #ede9fe;
      --tag-custom-text: #5b21b6;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.08);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --site-max-width: 1440px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* === 公告欄 === */
    .announcement-bar {
      background: linear-gradient(90deg, #fcefe8, #fdf4f0);
      color: #9c5c42;
      font-size: 13px;
      padding: 8px 16px;
      text-align: center;
      font-weight: 500;
      border-bottom: 1px solid rgba(224, 122, 95, 0.15);
      letter-spacing: 0.3px;
    }

    /* === 頂部導覽列 === */
    .site-header {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      transition: all 0.3s ease;
    }

    .nav-container {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo-icon {
      width: 44px;
      height: 44px;
      background: #fbf0ea;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid #fae1d6;
    }

    .brand-text h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #2e2621;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-right-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-link {
      font-size: 14px;
      font-weight: 600;
      color: #52525b;
      padding: 7px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link:hover {
      color: #2e2621;
      background: #f4efe9;
    }

    .nav-link.active {
      background: #2e2621;
      color: #ffffff;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .social-btn.ig {
      background: #fdf2f4;
      color: #d82b6b;
      border-color: #fbd6df;
    }
    .social-btn.ig:hover {
      background: #fae1e7;
    }

    .social-btn.threads {
      background: #f4f4f5;
      color: #18181b;
      border-color: #e4e4e7;
    }
    .social-btn.threads:hover {
      background: #e4e4e7;
      color: #000000;
    }

    .social-btn.line {
      background: #f0fdf4;
      color: #16a34a;
      border-color: #dcfce7;
    }
    .social-btn.line:hover {
      background: #dcfce7;
    }

    .social-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* === 控制欄（搜尋、最愛、顯示模式） === */
    .controls-container {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 24px auto 20px;
      padding: 0 24px;
    }

    .search-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 420px;
    }

    .search-input {
      width: 100%;
      padding: 11px 16px 11px 40px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: #d19a7e;
      box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
    }

    .right-tools-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tool-pill-btn {
      padding: 8px 16px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #52525b;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tool-pill-btn:hover {
      background: #f7f4f0;
      border-color: #d4cdc5;
    }

    .fav-filter-btn {
      padding: 8px 16px;
      background: #ffffff;
      border: 1px solid #fecdd3;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #e11d48;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .fav-filter-btn:hover {
      background: #fff1f2;
    }

    .fav-filter-btn.active {
      background: #e11d48;
      color: #ffffff;
      border-color: #e11d48;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }

    /* 分類導覽列 */
    .category-filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
    }

    .category-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .cat-btn {
      padding: 7px 18px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #52525b;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cat-btn:hover {
      border-color: #d4cdc5;
      background: #f7f4f0;
      color: var(--text-main);
    }

    .cat-btn.active {
      background: #2e2621;
      color: #ffffff;
      border-color: #2e2621;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(46, 38, 33, 0.2);
    }

    /* === 價格篩選與排序區塊 === */
    .price-filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      margin-top: 4px;
      border-top: 1px dashed #ede8e1;
    }

    .price-pills-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-size: 13px;
      font-weight: 600;
      color: #716358;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .price-btn {
      padding: 6px 14px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #52525b;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .price-btn:hover {
      background: #f7f4f0;
      border-color: #d4cdc5;
    }

    .price-btn.active {
      background: #c2410c;
      color: #ffffff;
      border-color: #c2410c;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(194, 65, 12, 0.25);
    }

    .price-custom-and-sort {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .custom-price-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 3px 8px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
    }

    .price-input {
      width: 68px;
      padding: 4px 6px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-main);
      outline: none;
      text-align: center;
      background: #faf8f5;
    }

    .price-input:focus {
      background: #ffffff;
      border-color: #e07a5f;
    }

    .price-apply-btn {
      background: #2e2621;
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .price-apply-btn:hover {
      background: #4a3d35;
    }

    .sort-select {
      padding: 6px 12px;
      border-radius: 18px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 12px;
      font-weight: 600;
      color: #52525b;
      outline: none;
      cursor: pointer;
    }

    /* === 商品網格列表 === */
    .product-grid {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 0 auto 60px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* 商品卡片 */
    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
      border-color: #ded8ce;
    }

    /* ★ 嚴格 1:1 正方形圖框 ★ */
    .img-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #f8f6f2;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ★ 完整呈現（contain）：不裁切任何內容 ★ */
    .product-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
      transition: transform 0.35s ease;
      display: block;
    }

    .product-card:hover .product-img {
      transform: scale(1.04);
    }

    /* 滿版模式 */
    body.img-fill-mode .product-img {
      object-fit: cover;
      padding: 0;
    }

    /* 愛心收藏按鈕 */
    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .fav-btn:hover {
      transform: scale(1.12);
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .fav-btn.active {
      background: #fff;
      color: #e11d48;
    }

    /* 卡片內容區 */
    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .tag-category-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      line-height: 1.2;
    }

    .tag-new { background: var(--tag-new); color: var(--tag-new-text); }
    .tag-stock { background: var(--tag-stock); color: var(--tag-stock-text); }
    .tag-hot { background: var(--tag-hot); color: var(--tag-hot-text); }
    .tag-default { background: #f3f4f6; color: #4b5563; }

    .category-label {
      font-size: 11px;
      color: var(--text-light);
      background: #f4f2ee;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .product-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #27272a;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 38px;
    }

    .price-action-row {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .product-price {
      font-weight: 700;
      color: #c2410c;
      font-size: 18px;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .price-currency {
      font-size: 12px;
      font-weight: 600;
      color: #c2410c;
    }

    .price-inquire {
      font-size: 13px;
      font-weight: 600;
      color: #9a6850;
      background: #fbf0ea;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #2e2621;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: #4a3d35;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(46, 38, 33, 0.25);
    }

    /* === 狀態提示 === */
    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: #ffffff;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-color);
    }

    .status-msg-icon {
      font-size: 40px;
      margin-bottom: 12px;
      display: block;
    }

    /* === 商品詳情頁面 Detail View === */
    #detail-view {
      display: none;
      max-width: 1040px;
      margin: 16px auto 60px;
      padding: 0 24px;
      width: 100%;
    }

    .detail-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .detail-top-nav {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faf8f5;
    }

    .back-btn {
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #52525b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #ede8e1;
      color: #27272a;
    }

    .detail-content {
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .detail-content {
        flex-direction: row;
      }
    }

    .detail-img-box {
      flex: 1.1;
      position: relative;
      aspect-ratio: 1 / 1;
      background: #f8f6f2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .detail-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 16px;
      display: block;
    }

    body.img-fill-mode .detail-img-box img {
      object-fit: cover;
      padding: 0;
    }

    .detail-info-box {
      flex: 1;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .detail-heading h1 {
      font-size: 24px;
      font-weight: 700;
      color: #27272a;
      margin: 10px 0 8px;
      line-height: 1.3;
    }

    .detail-desc {
      font-size: 14px;
      color: #52525b;
      line-height: 1.7;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .detail-price-box {
      padding: 14px 18px;
      background: #faf8f5;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .detail-price-val {
      font-size: 26px;
      font-weight: 800;
      color: #c2410c;
    }

    .order-tips-box {
      background: #fcf6ee;
      border: 1px solid #fae6cb;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 12px;
      color: #8c5825;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .order-tips-box strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .detail-cta-row {
      display: flex;
      gap: 12px;
      flex-direction: column;
    }

    .cta-primary {
      background: #2e2621;
      color: #ffffff;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .cta-primary:hover {
      background: #4a3d35;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(46, 38, 33, 0.2);
    }

    .cta-secondary {
      background: #fdf2f4;
      color: #d82b6b;
      border: 1px solid #fbd6df;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .cta-secondary:hover {
      background: #fae1e7;
    }

    /* === 頁尾 Footer === */
    .site-footer {
      margin-top: auto;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 40px 24px 30px;
    }

    .footer-content {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
      align-items: center;
    }

    .footer-brand h2 {
      font-size: 18px;
      font-weight: 700;
      color: #2e2621;
      margin-bottom: 6px;
    }

    .footer-brand p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer-copy {
      width: 100%;
      text-align: center;
      padding-top: 24px;
      margin-top: 24px;
      border-top: 1px solid #f2ede6;
      font-size: 12px;

      }
    };

    // === 擷取 Google Drive 檔案 ID ===
    function extractDriveId(url) {
      if (!url) return '';
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : '';
    }

    // === 格式化圖片網址（支援 本地 images/、純檔名、Google Drive、外部 CDN） ===
    function formatImageUrl(url) {
      if (!url) return '';
      url = url.trim();

      const driveId = extractDriveId(url);
      if (driveId) {
        return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;
      }

      if (url.startsWith('http://') || url.startsWith('https://')) {
        return url;
      }

      if (!url.startsWith('images/') && !url.startsWith('image/') && !url.startsWith('./')) {
        return `images/${url}`;
      }

      return url;
    }

    // === 圖片載入錯誤容錯處理 ===
    window.handleImageError = function(img) {
      const src = img.getAttribute('src') || '';
      if (!img.dataset.retry) {
        img.dataset.retry = '1';
        if (src.startsWith('images/')) {
          img.src = src.replace('images/', 'image/');
          return;
        } else if (src.startsWith('image/')) {
          img.src = src.replace('image/', 'images/');
          return;
        }
        const driveId = extractDriveId(src);
        if (driveId) {
          img.src = `https://lh3.googleusercontent.com/d/${driveId}`;
          return;
        }
      }
    };

    // === 擷取數值型價格（計算篩選與排序用） ===
    function getNumericPrice(price) {
      if (!price || price === '-' || String(price).trim() === '' || String(price).trim() === '洽詢') {
        return null;
      }
      const cleanStr = String(price).replace(/[^\d.]/g, '');
      if (!cleanStr) return null;
      const num = parseFloat(cleanStr);
      return isNaN(num) ? null : num;
    }

    // === 格式化價格顯示（避免顯示 NT$ - 或空值） ===
    function formatPriceHtml(price) {
      if (!price || price === '-' || String(price).trim() === '' || String(price).trim() === '洽詢') {
        return `<span class="price-inquire">私訊洽詢</span>`;
      }
      const rawStr = String(price).trim();
      if (rawStr.includes('$')) {
        return `<span class="price-val">${rawStr}</span>`;
      }
      const numOnly = rawStr.replace(/[^\d.]/g, '');
      if (numOnly) {
        return `<span class="price-currency">NT$</span> <span class="price-val">${Number(numOnly).toLocaleString()}</span>`;
      }
      return `<span class="price-val">${rawStr}</span>`;
    }

    // === 標籤顏色類別 ===
    function getTagClass(tag) {
      if (!tag) return '';
      if (tag.includes('新')) return 'tag-new';
      if (tag.includes('現貨')) return 'tag-stock';
      if (tag.includes('熱') || tag.includes('限')) return 'tag-hot';
      return 'tag-default';
    }

    // === 處理外連私訊或預設社群連結 ===
    function resolveActionLink(link) {
      if (!link || link.trim() === '' || link.includes('google.com/?client=safari')) {
        return BRAND_CONFIG.instagramUrl || '#';
      }
      return link.trim();
    }

    // === 動態產生分類標籤按鈕 ===
    function generateCategoryButtons() {
      const categories = [...new Set(productsData.map(p => p.category ? p.category.trim() : ''))].filter(Boolean);

      let html = `<button class="cat-btn ${currentCategory === '全部' ? 'active' : ''}" onclick="setCategory('全部')">全部商品</button>`;
      categories.forEach(cat => {
        html += `<button class="cat-btn ${currentCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`;
      });
      categoryNav.innerHTML = html;
    }

    // === 切換分類 ===
    window.setCategory = function(cat) {
      currentCategory = cat;
      showingOnlyFavorites = false;
      document.getElementById('toggle-fav-view').classList.remove('active');
      generateCategoryButtons();
      renderProducts();
    };

    // === 快捷價格區間篩選 ===
    window.setPriceRange = function(rangeKey) {
      currentPriceRange = rangeKey;
      customMinPrice = null;
      customMaxPrice = null;

      // 清空自訂輸入框
      const minInput = document.getElementById('min-price');
      const maxInput = document.getElementById('max-price');
      if (minInput) minInput.value = '';
      if (maxInput) maxInput.value = '';

      // 更新按鈕 active 樣式
      document.querySelectorAll('.price-btn').forEach(btn => {
        if (btn.getAttribute('data-range') === rangeKey) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderProducts();
    };

    // === 自訂價格區間篩選 ===
    window.applyCustomPrice = function() {
      const minVal = document.getElementById('min-price').value.trim();
      const maxVal = document.getElementById('max-price').value.trim();

      if (minVal === '' && maxVal === '') {
        setPriceRange('all');
        return;
      }

      customMinPrice = minVal !== '' ? parseFloat(minVal) : null;
      customMaxPrice = maxVal !== '' ? parseFloat(maxVal) : null;
      currentPriceRange = 'custom';

      document.querySelectorAll('.price-btn').forEach(btn => btn.classList.remove('active'));
      renderProducts();
    };

    // === 排序切換 ===
    window.handleSortChange = function(val) {
      currentSort = val;
      renderProducts();
    };

    // === 搜尋關鍵字處理 ===
    window.handleSearch = function(val) {
      searchQuery = val.trim().toLowerCase();
      renderProducts();
    };

    // === 我的最愛儲存 ===
    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem('my_favorites') || '[]');
      } catch (e) {
        return [];
      }
    }

    function updateFavCountBadge() {
      const favs = getFavorites();
      if (favBtnLabel) {
        favBtnLabel.innerText = `我的最愛 (${favs.length})`;
      }
    }

    window.toggleFavorite = function(event, productId, fromDetail = false) {
      if (event) event.stopPropagation();
      let favs = getFavorites();
      if (favs.includes(productId)) {
        favs = favs.filter(id => id !== productId);
      } else {
        favs.push(productId);
      }
      localStorage.setItem('my_favorites', JSON.stringify(favs));
      updateFavCountBadge();
      renderProducts();
      if (fromDetail) showDetail(productId);
    };

    // === 渲染商品列表 ===
    function renderProducts() {
      const favs = getFavorites();
      updateFavCountBadge();
      gridContainer.innerHTML = '';

      let displayProducts = productsData;

      // 1. 分類過濾
      if (currentCategory !== '全部') {
        displayProducts = displayProducts.filter(p => (p.category ? p.category.trim() : '') === currentCategory);
      }

      // 2. 我的最愛過濾
      if (showingOnlyFavorites) {
        displayProducts = displayProducts.filter(p => favs.includes(p.id));
      }

      // 3. 關鍵字搜尋過濾
      if (searchQuery !== '') {
        displayProducts = displayProducts.filter(p => {
          const title = (p.title || '').toLowerCase();
          const desc = (p.desc || '').toLowerCase();
          const tag = (p.tag || '').toLowerCase();
          const cat = (p.category || '').toLowerCase();
          return title.includes(searchQuery) || desc.includes(searchQuery) || tag.includes(searchQuery) || cat.includes(searchQuery);
        });
      }

      // 4. 價格區間篩選
      if (currentPriceRange !== 'all') {
        displayProducts = displayProducts.filter(p => {
          const numPrice = getNumericPrice(p.price);

          if (currentPriceRange === 'inquire') {
            return numPrice === null;
          }
          if (currentPriceRange === 'under200') {
            return numPrice !== null && numPrice <= 200;
          }
          if (currentPriceRange === '200-500') {
            return numPrice !== null && numPrice >= 200 && numPrice <= 500;
          }
          if (currentPriceRange === 'above500') {
            return numPrice !== null && numPrice >= 500;
          }
          if (currentPriceRange === 'custom') {
            if (numPrice === null) return false;
            if (customMinPrice !== null && numPrice < customMinPrice) return false;
            if (customMaxPrice !== null && numPrice > customMaxPrice) return false;
            return true;
          }
          return true;
        });
      }

      // 5. 排序處理
      if (currentSort === 'price-asc') {
        displayProducts = [...displayProducts].sort((a, b) => {
          const pa = getNumericPrice(a.price);
          const pb = getNumericPrice(b.price);
          if (pa === null && pb === null) return 0;
          if (pa === null) return 1; // 私訊洽詢排在最後
          if (pb === null) return -1;
          return pa - pb;
        });
      } else if (currentSort === 'price-desc') {
        displayProducts = [...displayProducts].sort((a, b) => {
          const pa = getNumericPrice(a.price);
          const pb = getNumericPrice(b.price);
          if (pa === null && pb === null) return 0;
          if (pa === null) return 1;
          if (pb === null) return -1;
          return pb - pa;
        });
      }

      // 空白狀態處理
      if (displayProducts.length === 0) {
        gridContainer.innerHTML = `
          <div class="status-msg">
            <span class="status-msg-icon">🔍</span>
            <p style="font-weight:600; font-size:16px; margin-bottom:4px;">沒有找到符合的商品</p>
            <p style="font-size:13px; color:var(--text-light);">請嘗試更換分類標籤、調整價格區間，或清除搜尋關鍵字看看喔！</p>
          </div>
        `;
        return;
      }

      // 產生商品卡片
      displayProducts.forEach(product => {
        const isFav = favs.includes(product.id);
        const imgUrl = formatImageUrl(product.img);
        const priceHtml = formatPriceHtml(product.price);
        const tagClass = getTagClass(product.tag);
        const actionUrl = resolveActionLink(product.link);
        const btnLabel = product.btnText || '私訊詢問';

        gridContainer.innerHTML += `
          <div class="product-card" onclick="showDetail('${product.id}')">
            <div class="img-container">
              <img class="product-img" src="${imgUrl}" alt="${product.title || ''}" loading="lazy" onerror="handleImageError(this)">
              <button class="fav-btn ${isFav ? 'active' : ''}" title="${isFav ? '移除最愛' : '加入最愛'}" onclick="toggleFavorite(event, '${product.id}')">
                ${isFav ? '❤️' : '🤍'}
              </button>
            </div>
            <div class="product-info">
              <div class="tag-category-row">
                ${product.tag ? `<span class="tag ${tagClass}">${product.tag}</span>` : ''}
                ${product.category ? `<span class="category-label">${product.category}</span>` : ''}
              </div>
              <h3 class="product-title">${product.title || '刺繡手作配件'}</h3>
              <p class="product-desc">${product.desc || '精美手作刺繡日常配件'}</p>
              <div class="price-action-row">
                <div class="product-price">${priceHtml}</div>
                <a class="action-btn" href="${actionUrl}" target="_blank" onclick="event.stopPropagation()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                  ${btnLabel}
                </a>
              </div>
            </div>
          </div>
        `;
      });
    }

    // === 最愛篩選按鈕點擊切換 ===
    document.getElementById('toggle-fav-view').addEventListener('click', (e) => {
      showingOnlyFavorites = !showingOnlyFavorites;
      const btn = document.getElementById('toggle-fav-view');
      if (showingOnlyFavorites) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
      renderProducts();
    });

    // === 顯示商品詳細視圖 ===
    window.showDetail = function(productId) {
      const product = productsData.find(p => p.id === productId);
      if (!product) return;
      const isFav = getFavorites().includes(product.id);
      const imgUrl = formatImageUrl(product.img);
      const priceHtml = formatPriceHtml(product.price);
      const tagClass = getTagClass(product.tag);
      const actionUrl = resolveActionLink(product.link);
      const btnLabel = product.btnText || '私訊詢問';

      document.getElementById('list-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.getElementById('detail-container').innerHTML = `
        <div class="detail-content">
          <div class="detail-img-box">
            <img src="${imgUrl}" alt="${product.title || ''}" onerror="handleImageError(this)">
            <button class="fav-btn ${isFav ? 'active' : ''}" style="top:16px; right:16px; width:44px; height:44px; font-size:20px;" onclick="toggleFavorite(event, '${product.id}', true)">
              ${isFav ? '❤️' : '🤍'}
            </button>
          </div>
          <div class="detail-info-box">
            <div class="detail-heading">
              <div class="tag-category-row">
                ${product.tag ? `<span class="tag ${tagClass}">${product.tag}</span>` : ''}
                ${product.category ? `<span class="category-label">${product.category}</span>` : ''}
              </div>
              <h1>${product.title || '手工刺繡選品'}</h1>
              <div class="detail-desc">${product.desc || '全手作質感刺繡，可作為日常裝飾或客製送禮首選。'}</div>
            </div>

            <div class="detail-price-box">
              <span style="font-size:14px; color:var(--text-muted); font-weight:600;">商品價格</span>
              <div class="detail-price-val">${priceHtml}</div>
            </div>

            <div class="order-tips-box">
              <strong>💡 如何訂購或詢價？</strong>
              點擊下方私訊按鈕，將商品截圖發送至我們的 Instagram、Threads 或 LINE 小盒子即可完成預訂！完整客製流程歡迎查看 <a href="index.html" style="text-decoration:underline; font-weight:700; color:#8c5825;">品牌介紹＆訂購須知</a>。
            </div>

            <div class="detail-cta-row">
              <a class="cta-primary" href="${actionUrl}" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                ${btnLabel} (截圖私訊訂購)
              </a>
              <a class="cta-secondary" href="${BRAND_CONFIG.instagramUrl}" target="_blank">
                <span>Instagram 實拍照</span>
              </a>
              <a class="cta-secondary" href="${BRAND_CONFIG.threadsUrl}" target="_blank" style="background:#f4f4f5; color:#18181b; border-color:#e4e4e7;">
                <span>Threads 交流</span>
              </a>
            </div>
          </div>
        </div>
      `;
    };

    // === 隱藏商品詳細視圖 ===
    window.hideDetail = function() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('list-view').style.display = 'block';
    };

    // === 從 Google 試算表 CSV 即時載入 ===
    function loadDataFromCSV() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        transformHeader: function(h) {
          return h.trim();
        },
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            const validData = results.data.filter(row => row.id && row.id.trim() !== "");
            if (validData.length > 0) {
              productsData = validData;
              generateCategoryButtons();
              renderProducts();
            }
          }
        },
        error: function(err) {
          console.warn("Google 試算表 CSV 連線中斷，已維持呈現預設商品資料", err);
        }
      });
    }

    // === 初始化頁面 ===
    generateCategoryButtons();
    renderProducts();
    updateFavCountBadge();
    loadDataFromCSV();
  </script>
</body>
</html>
